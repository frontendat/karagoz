schemaVersion: "1"
kind: mixin
name: pnpm
displayName: pnpm Package Manager
description: Install pnpm globally

network:
  allowedDomains:
    - registry.npmjs.org
    - registry.yarnpkg.com
    - get.pnpm.io
    - cjs.pnpm.io

environment:
  variables:
    NPM_CONFIG_PREFIX: /usr/local/share/npm

commands:
  install:
    - command: "corepack enable pnpm"
      description: Enable pnpm
