name: CI

# No path filters: `ci` is a required check and must report on every change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR runs are cancelled; runs on `main` always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/nx
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Format check and lint
        run: pnpm exec nx run-many -t fmt:check lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/nx
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      # The libraries are built first through the dependency graph (`test` depends on `^build`). The sandbox's test
      # script runs with coverage and fails below its thresholds.
      - name: Unit tests with coverage
        run: pnpm exec nx run-many -t test
      - name: Coverage totals
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const { total } = JSON.parse(require("fs").readFileSync("packages/sandbox/coverage/coverage-summary.json", "utf8"));
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${total[k].pct}% | ${total[k].covered}/${total[k].total} |`);
            console.log(["### @karagoz/sandbox coverage", "", "| | % | covered |", "|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-coverage
          path: packages/sandbox/coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/nx
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Resolve the Playwright version
        id: playwright
        working-directory: apps/docs
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        if: ${{ steps.browser.outputs.cache-hit != 'true' }}
        working-directory: apps/docs
        run: pnpm exec playwright install --with-deps chromium
      # On a cache hit the browser is there; only the OS dependencies are missing.
      - name: Install the OS dependencies of the browser
        if: ${{ steps.browser.outputs.cache-hit == 'true' }}
        working-directory: apps/docs
        run: pnpm exec playwright install-deps chromium
      - name: Build the docs and run the blocking end-to-end tests
        run: pnpm exec nx run @karagoz/docs:e2e
      - name: Upload the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Advisory: boots the real WebContainer from the StackBlitz hosts, so it is left out of the `ci` aggregate's needs.
  # Promote it by adding it there once it has a track record.
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/nx
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Resolve the Playwright version
        id: playwright
        working-directory: apps/docs
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        if: ${{ steps.browser.outputs.cache-hit != 'true' }}
        working-directory: apps/docs
        run: pnpm exec playwright install --with-deps chromium
      # On a cache hit the browser is there; only the OS dependencies are missing.
      - name: Install the OS dependencies of the browser
        if: ${{ steps.browser.outputs.cache-hit == 'true' }}
        working-directory: apps/docs
        run: pnpm exec playwright install-deps chromium
      - name: Run the smoke tests against the real WebContainer
        run: pnpm exec nx run @karagoz/docs:e2e:smoke
      - name: Upload the Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The only required check: reshape the jobs above without touching branch protection.
  ci:
    name: ci
    needs: [static, unit, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
